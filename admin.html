<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Admin — VORTEXUS 26</title><link rel="stylesheet" href="style.css?v=20260916fix"><style>.admin-page{max-width:1250px;width:92%;margin:auto;padding:42px 0 70px}.admin-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.admin-top h1{margin:4px 0;font-size:clamp(28px,5vw,44px)}.admin-top p{margin:0;color:#9bb6d3}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:12px;text-decoration:none;color:#fff;background:rgba(50,130,210,.18);border:1px solid rgba(100,190,255,.18)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.stat{padding:20px;border:1px solid rgba(100,190,255,.14);border-radius:18px;background:rgba(5,25,48,.72)}.stat small{display:block;color:#8faaca;font-size:12px}.stat strong{display:block;font-size:30px;margin-top:5px}.stat.pending strong{color:#ffd15c}.stat.approved strong{color:#52e6a4}.stat.rejected strong{color:#ff7c8c}.panel{border:1px solid rgba(100,190,255,.14);border-radius:22px;background:rgba(4,21,41,.78);overflow:hidden}.panel-head{padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid rgba(100,190,255,.12)}.panel-head h2{margin:0}.admin-filter{padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap}.admin-filter button{border:1px solid rgba(100,190,255,.14);background:rgba(100,150,200,.07);color:#b8cde2;padding:8px 12px;border-radius:10px;cursor:pointer}.admin-filter button.active{background:#0b4c91;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:13px 15px;border-bottom:1px solid rgba(100,190,255,.1);text-align:left;font-size:13px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#75cfff}.thumb{width:58px;height:45px;object-fit:cover;border-radius:9px;background:#06182d}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;text-transform:capitalize}.badge.pending{background:rgba(255,209,92,.12);color:#ffd15c}.badge.approved{background:rgba(82,230,164,.1);color:#52e6a4}.badge.rejected{background:rgba(255,124,140,.1);color:#ff7c8c}.row-actions{display:flex;gap:6px;flex-wrap:wrap}.row-actions button{border:0;padding:8px 10px;border-radius:9px;background:#0b4c91;color:#fff;cursor:pointer}.row-actions .reject{background:#5d3b48}.row-actions .delete{background:#702d38}.empty-admin{text-align:center;padding:50px;color:#8faaca}@media(max-width:800px){.admin-top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.admin-page{width:94%;padding-top:28px}}</style></head><body><header class="navbar"><a class="brand" href="index.html"><img src="logo-vortexus.png" alt="VORTEXUS"><div><strong>VORTEXUS 26</strong><small>ADMIN LOKAL</small></div></a><nav><a href="index.html">Website</a><a href="login.html">Login</a></nav></header><main class="admin-page"><div class="admin-top"><div><span class="eyebrow">CONTROL CENTER</span><h1>Panel Admin</h1><p>Moderasi upload kenangan yang tersimpan online.</p></div><div class="admin-actions"><a class="admin-btn" href="index.html">← Website</a><button class="admin-btn" id="clearData" type="button">🗑 Hapus Semua Data</button><button class="admin-btn" id="adminLogout" type="button">🚪 Keluar Admin</button></div></div><div class="notice error" id="adminWarning">☁️ Data upload tersimpan online: Firebase Firestore + Cloudinary.</div><div class="stats"><div class="stat"><small>Total Upload</small><strong id="sTotal">0</strong></div><div class="stat pending"><small>Menunggu</small><strong id="sPending">0</strong></div><div class="stat approved"><small>Disetujui</small><strong id="sApproved">0</strong></div><div class="stat rejected"><small>Ditolak</small><strong id="sRejected">0</strong></div></div><section class="panel"><div class="panel-head"><h2>📁 Daftar Upload</h2><span id="mediaSummary" style="color:#8faaca;font-size:13px"></span></div><div class="admin-filter"><button class="active" data-admin-filter="all">Semua</button><button data-admin-filter="pending">Menunggu</button><button data-admin-filter="approved">Disetujui</button><button data-admin-filter="rejected">Ditolak</button></div><div class="table-wrap"><table><thead><tr><th>Media</th><th>Judul</th><th>Uploader</th><th>Jurusan</th><th>Jenis</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead><tbody id="adminBody"></tbody></table></div></section></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
